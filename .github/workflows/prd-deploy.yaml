name: Production Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Lambda binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -tags lambda.norpc -o deployment/build/bootstrap ./cmd/once
          chmod +x deployment/build/bootstrap
        shell: bash
      - name: configure-aws-credentials
        uses: aws-actions/configure-aws-credentials@master
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::891377239454:role/rssplus-github-actions-main
          role-session-name: GitHubActions
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: cd deployment/ && terraform init
        shell: bash
      - name: Terraform Apply
        run: cd deployment/ && terraform apply -auto-approve
        id: tf-apply
        shell: bash
